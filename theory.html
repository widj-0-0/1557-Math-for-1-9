<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body {
            background: linear-gradient(135deg, #fcfcfc 0%, #f8d4f8 100%);
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid rgb(118, 139, 72);
        }
        
        .header {
            margin-bottom: 20px;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        h1 {
            color: rgb(78, 70, 68);
            font-size: 22px;
            margin: 10px 0;
        }
        
        .theme-info {
            background: rgb(118, 139, 72);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 25px;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        .theory-content {
            text-align: left;
            margin: 20px 0;
            padding: 40px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid rgb(118, 139, 72);
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-line;
            animation: slideIn 0.6s;
        }
        
        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateX(-20px);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .buttons {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }
        
        .action-btn {
            background: rgb(182, 119, 146);
            color: white;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 20px;
            margin: 0 5px;
            display: inline-block;
            transition: 0.3s;
        }
        
        .action-btn:hover {
            background: rgb(160, 100, 126);
            transform: translateY(-2px);
        }
        
        .back-btn {
            background: rgb(182, 119, 146);
        }
        
        .back-btn:hover {
            background: rgb(160, 100, 126);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .theory-content {
                font-size: 14px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="theme-info">{{ class_num }} класс • {{ theme_name }}</div>
            <h1>{{ theme_name }}</h1>
        </div>
        
        <div class="theory-content">
            {{ theory }}
        </div>
        
        <div class="buttons">
            <a href="/class/{{ class_num }}" class="action-btn back-btn">
                ← К темам
            </a>
            
            <a href="/tasks/{{ class_num }}/{{ theme_key }}" class="action-btn">
                Проверить себя
            </a>
        </div>
    </div>
</body>
</html>
